; M5Stack CoreS3 SE（K128-SE）。PSRAM は公式の 8MB Quad なので qio_qspi。
; driver/pulse_cnt.h を使うため pioarduino 55.03.312（Arduino 3.3.x / ESP-IDF 5.5）。
; 公式 espressif32 6.12 と 7.0 は旧 driver/pcnt.h しか無い。混ぜない。
; ビルドはこのフォルダで行う。書き込みは操作者が明示したときだけ。

[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DENCODER_TESTER_USB_POWER=0

; USB のみで給電し、CoreS3 が Grove 5V を出す構成（10/22 と同じ）。Bottom の DC 入力は接続しない。
; DIN 12V と USB の同時接続で電源断する問題（GitHub Issue #1）を避けて測定するための環境。
; Bottom は DIN Base から Base15 に変更した（バッテリー無し）。Base15 の DC と USB の同時接続は未検証。
[env:m5stack-cores3-usbpower]
extends = env:m5stack-cores3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DENCODER_TESTER_USB_POWER=1

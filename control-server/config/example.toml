# h3-control-server 設定の例（実機用の雛形）。
# 単位は名前に含める: count, count/s, count/s², ms。
# 校正・符号・リミットの変更は DISARMED のときだけ（サーバー再起動で反映）。
#
# !!! 軸 2・3 の値は未測定の仮値。軸 1 の値をコピーしない（architecture.md §6）。
# !!! calibration_valid = false のあいだは ARM できない。

schema_version = 2
rig_id = "h3-bench-01"

# 主電源リレー（DC_STOP1 緑, G2）を操作する唯一の軸
power_controller_axis = 1

[server]
bind = "127.0.0.1:8892"
admin_token_env = "H3CS_ADMIN_TOKEN"
allowed_origins = ["http://localhost:8891", "http://127.0.0.1:8891"]
max_body_bytes = 4096
admin_rate_limit_per_s = 20
status_period_ms = 100

[timing]
planner_period_ms = 10
set_position_valid_for_ms = 50
mcu_command_timeout_ms = 100
mcu_stop_timeout_ms = 1500
axis_status_timeout_ms = 200
source_freshness_ms = 250
arm_timeout_ms = 5000
stop_settle_timeout_ms = 3000
stop_hold_ms = 1000
max_frame_skew = 5
center_reach_timeout_ms = 5000   # measured positions must catch up with the centre setpoint within this
rest_velocity_count_s = 50       # "at rest" = |velocity| <= this AND |following_error| <= rest_error_count ...
rest_error_count = 50            # ... (>= limits.deadband_out_count) held for rest_dwell_ms; STOPPING and the
rest_dwell_ms = 200              # post-center settle judge the MEASURED axes with it, not only the trajectory
hello_retry_ms = 200
hello_timeout_ms = 2000

[game]
allow_missing_frame_seq = false  # 有人運転では frame_seq 必須
clamp_out_of_range = true
virtual_min = 0.0
virtual_max = 1023.0
center_speed_fraction = 0.25
# Center counts as reached only when every axis's MEASURED position is within this
# many counts of neutral (>= limits.deadband_out_count). A lagging axis past
# timing.center_reach_timeout_ms latches a fault instead of a false "center_reached".
center_tolerance_count = 50
# Rig orientation: how the game's pitch / roll / yaw map onto the mixer (operator
# setting, decided by the orientation check; the game never needs to know).
swap_pitch_roll = false
invert_pitch = false
invert_roll = false
invert_yaw = false

[limits]                         # 動きの制限値（docs/control-server/limits.md）。3 軸共通。どの値も実機未検証の見積もり
# 実行時に変えられる 4 つ（WS /v1/motion の limits、POST /v1/limits。POST /v1/session で初期値に戻る）。
# 上限はファームの絶対上限（HELLO 後の LIMITS で申告。Duty 60 %、6000 count/s、40000 count/s²）と gain 1.0
max_gain = 0.5                   # pitch と roll を同時に振り切っても仮想 0〜1023 で飽和しない最大値
max_vel_count_s = 3000           # 7.5 回転/s。上限はさらに overspeed_count_s / 1.5 で頭打ち
max_acc_count_s2 = 15000         # 0 → 3000 count/s に 0.2 s
duty_max_percent = 40            # 位置ループの Duty 上限（ファームへ SET_LIMITS で配る）
# 初期値だけ（SET_LIMITS で配る。実行時には変えない）
duty_min_percent = 3             # 旧ファームの 7 % では低速が段付きになった（仮説）
kp_percent_per_100 = 2           # 誤差 100 count あたり 2 %
ff_count_s_per_percent = 100     # 軌道速度 [count/s] ÷ これ = Duty [%]（実測 1 % ≈ 100〜130 count/s の下側）
deadband_count = 10              # 目標が止まっているときの到達帯（入る側）
deadband_out_count = 20          # 同（出る側）
# 保護（CONFIG で配る。実行時には変えない）
following_error_limit_count = 800
overspeed_count_s = 9000         # ≥ 1.5 × max_vel_count_s（検査される）。1.5 × ファーム絶対上限 6000

[backend]
kind = "serial"
# 軸は各 CoreS3 で選択した系統（HELLO / STATUS の selected_axis、protocol.md §1.1）で
# 決まる。ポート番号の順番には依存しない。下の device_id は照合用。
ports = ["/dev/cu.usbmodem1101", "/dev/cu.usbmodem1201", "/dev/cu.usbmodem1301"]

[[axis]]
axis_id = 1
device_id = "0000000000000000"   # 照合用（0 = 照合しない）。実機の HELLO の値を書くと、別の個体がこの系統を選んだとき ARM しない（axis_device_mismatch）
name = "右手前リフト (motor #1)"
calibration_valid = false
# 2026-10-25 無負荷・1 測定点。水平付近を 0 とした値。向き（旧仮想 0→1023 で上がるか下がるか）は未確認
count_at_virtual_0 = -2000
count_at_virtual_512 = 0
count_at_virtual_1023 = 2000
mechanical_min_count = -2742
mechanical_max_count = 2814
soft_min_count = -2300
soft_max_count = 2300
decel_zone_count = 300

[[axis]]
axis_id = 2
device_id = "0000000000000000"   # 照合用（0 = 照合しない）。同じ系統を 2 台が選ぶと ARM 不可（axis_conflict）
name = "左リフト (motor #2)"
calibration_valid = false
# 未測定の仮値（小さく取る）
count_at_virtual_0 = -400
count_at_virtual_512 = 0
count_at_virtual_1023 = 400
mechanical_min_count = -1000
mechanical_max_count = 1000
soft_min_count = -600
soft_max_count = 600
decel_zone_count = 300

[[axis]]
axis_id = 3
device_id = "0000000000000000"   # 照合用（0 = 照合しない）
name = "後部ヨー (motor #3)"
calibration_valid = false
# 未測定の仮値（小さく取る）
count_at_virtual_0 = -400
count_at_virtual_512 = 0
count_at_virtual_1023 = 400
mechanical_min_count = -1000
mechanical_max_count = 1000
soft_min_count = -600
soft_max_count = 600
decel_zone_count = 300

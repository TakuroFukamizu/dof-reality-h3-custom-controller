; M5Stack CoreS3 SE (K128-SE). PSRAM は公式仕様の 8MB Quad。
; 書き込み: pio run -t upload
; モニタ:   pio device monitor

[env:m5stack-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
lib_deps =
    m5stack/M5Unified@^0.2.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_USB_POWER=0

; USB のみで給電し、CoreS3 が Grove 5V を出す構成。Bottom の DC 入力は接続しない。
; DIN 12V と USB の同時接続で約 85 秒後に電源断する問題（GitHub Issue #1）を避けて開発するための環境。
; Bottom は DIN Base から Base15 に変更した（バッテリー無し）。Base15 の DC と USB の同時接続は未検証。
[env:m5stack-cores3-usbpower]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_USB_POWER=1

; 機構の切り分け専用。手動速度（S）の無パルス／遅すぎ停止を切り、フィードバックセンサーを無視して動かす。
; センサー断線でも止まらないので、人が機構から離れた状態で、短時間だけ使う。通常運用・校正には使わない。
[env:m5stack-cores3-noguard]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_USB_POWER=0
    -DMC_NO_MANUAL_GUARD=1

; Issue #1 の調査用。DIN 12V 受電の設定（env:m5stack-cores3 と同じ）に、AXP2101 の状態を 1 秒ごとにシリアルへ出す処理を足す。
; 受信側は tools/pmic_monitor.py。
; Issue #68 で、M5.begin() より前に読んだ値（PMICPRE 行）と POR の目印（REG04〜07）を足した。
[env:m5stack-cores3-pmiclog]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_USB_POWER=0
    -DMC_PMIC_LOG=1

; Issue #1 の検証。pmiclog に加えて、AXP2101 の電池充電（REG18 b1）と電池検出（REG68 b0）を切る。
; DIN Base のバッテリーを外して使う構成で、電源断が止まるかを見る（DIN Base 時代の記録。Base15 ではバッテリー自体が無い）。
[env:m5stack-cores3-pmiclog-nobatt]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_USB_POWER=0
    -DMC_PMIC_LOG=1
    -DMC_PMIC_NOBATT=1

; USB プロトコル v1（h3-control-server 接続）。Base15 の DC 給電 + USB CDC はバイナリ専用（テキストコマンド無効）。
; 設計: docs/superpowers/specs/2026-10-31-moter-controler-v1-protocol-design.md、仕様: docs/control-server/protocol.md
; CORE_DEBUG_LEVEL=0: Arduino core の log_e() はコンパイル時にこの値で選ばれ、ets_printf 経由で USB CDC（IDF の
; 第 2 コンソール）に文字が出る。esp_log_level_set では止まらないので、v1 では 0 にして文字を出さない。
[env:m5stack-cores3-v1]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMC_USB_POWER=0
    -DMC_PROTO_V1=1

; USB のみ給電 + v1（机上確認用。Bottom の DC は接続しない）
[env:m5stack-cores3-v1-usbpower]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMC_USB_POWER=1
    -DMC_PROTO_V1=1

; M5Stack CoreS3 SE (K128-SE). PSRAM は公式仕様の 8MB Quad。
; 書き込み: pio run -t upload
; モニタ:   pio device monitor

[env:m5stack-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
lib_deps =
    m5stack/M5Unified@^0.2.5
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Issue #1（DIN 12V と USB の同時接続で CoreS3 が電源断する）の調査用。
; DIN Base の 5V を受ける設定にして、AXP2101 の状態を 1 秒ごとにシリアルへ出す。受信側は tools/pmic_monitor.py。
[env:m5stack-cores3-pmiclog]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_PMIC_LOG=1

; pmiclog に加えて、AXP2101 の電池充電（REG18 b1）と電池検出（REG68 b0）を切る。
; DIN Base のバッテリーを外して使う構成で、電源断が止まるかを見る。
[env:m5stack-cores3-pmiclog-nobatt]
extends = env:m5stack-cores3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMC_PMIC_LOG=1
    -DMC_PMIC_NOBATT=1
